name: ubuntu-24.04 CI (clang)

on:
  push:

env:
  TERM: xterm-256color

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            asciidoctor \
            gettext \
            libbpf-dev \
            libelf-dev \
            libseccomp-dev \
            pkgconf \
            python3-pytest \
            zlib1g-dev \
            llvm \
            linux-tools-common \
            linux-tools-azure

      - name: Install bpftool workaround
        shell: bash
        run: |
         set -euo pipefail
         KREL="$(uname -r)"
         if ! /usr/sbin/bpftool -V >/dev/null 2>&1; then
           if ! find /usr/lib -type f -name bpftool -perm -111 2>/dev/null | grep -q .; then
             sudo apt install -y --no-install-recommends linux-tools-generic
           fi
           FALLBACK="$(find /usr/lib -type f -name bpftool -perm -111 2>/dev/null | sort -V | tail -n 1)"
           [[ -n "$FALLBACK" ]] || { echo "No bpftool payload found"; exit 1; }
           sudo mkdir -p "/usr/lib/linux-tools/${KREL}"
           sudo ln -sf "$FALLBACK" "/usr/lib/linux-tools/${KREL}/bpftool"
         fi

      - name: Configure
        run: ./configure --devmode --prefix=/usr --destdir=build/inst

      - name: Make
        run: make -j$(nproc)

      - name: Make test
        run: make test -j$(nproc)

      - name: Test
        run: sudo pytest test

      - name: Install
        run: make install

      - name: List files size
        run: (cd build/inst && tree --du -h .)
