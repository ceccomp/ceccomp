name: ubuntu-26.04-arm CI (bpf-gcc)

on:
  push:

env:
  TERM: xterm-256color

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bpftool \
            gcc-bpf \
            libbpf-dev \
            libseccomp-dev \
            pkgconf \
            python3-pytest

      - name: Configure
        run: BPF_CC=bpf-gcc ./configure --devmode --prefix=/usr --destdir=build/inst

      - name: Make ceccomp
        run: make -j$(nproc)

      - name: Make test
        run: make test -j$(nproc)

      - name: Test
        run: pytest test

      - name: Install
        run: make install

      - name: List files size
        run: (cd build/inst && tree --du -h .)
